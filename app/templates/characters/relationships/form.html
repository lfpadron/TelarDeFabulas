{% extends "characters/relationships/base.html" %}
{% load i18n %}
{% block relationship_content %}
<h1>{{ title }}</h1>
<form method="post">{% csrf_token %}{{ form.as_p }}
<div class="actions"><button class="button" type="submit">{% trans "Guardar relación" %}</button>

</form>
{% endblock %}
